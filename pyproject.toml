[project]
name = "robot-data-audit"
version = "1.0.0"
description = "Audit robot-learning datasets and annotate every episode densely with a vision-language model and deterministic checks."
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.11.*"
dependencies = [
    "av==18.1.0",
    "huggingface-hub==1.32.0",
    "mcap==1.4.0",
    "mcap-protobuf-support==0.5.4",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pillow==12.3.0",
    "protobuf==7.36.2",
    "pyarrow==25.0.1",
    "scipy==1.17.1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
