name: Offline checks

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENAI_API_KEY: ""
  OPENROUTER_API_KEYS: ""
  HF_TOKEN: ""
  HF_HUB_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"

jobs:
  # The suite runs as eight shards side by side, each a set of whole test files balanced by recorded time
  # (tests/sharding.py); "tests" passes only when every shard does.
  shard:
    name: tests ${{ matrix.shard }}/8
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.7"
          python-version: "3.11.15"
          enable-cache: true
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          package-manager-cache: false
      # ffmpeg's packages are kept in the Actions cache, keyed on the runner OS, so a run installs them from the cache
      # and needs no package mirror. A mirror that slowed to about 60 KB/s on some runners held this step until the
      # job's limit (PR 136, two shards, 17 min, 2026-10-22); a cached package that no longer fits a newer image falls
      # back to apt below.
      - name: Name the video tools cache
        id: video-key
        run: echo "key=video-debs-$ImageOS-v1" >> "$GITHUB_OUTPUT"
      - name: Restore the video tools packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/video-debs
          key: ${{ steps.video-key.outputs.key }}
      - name: Install video tools
        timeout-minutes: 12
        run: |
          mkdir -p ~/video-debs/partial
          if ls ~/video-debs/*.deb >/dev/null 2>&1 && sudo dpkg -i ~/video-debs/*.deb >/dev/null; then
            echo "installed $(ls ~/video-debs/*.deb | wc -l) cached packages"
          else
            # the runner image lists third-party repositories (packages.microsoft.com among them) whose index can
            # refuse a fetch; that must not fail the job, and the install still fails if Ubuntu's index is missing.
            # Every fetch gives up after 30s and is retried, and the install is tried three times, each time from
            # another mirror: a slow mirror trickles data, so a fetch timeout alone never fires. Packages a slow
            # attempt finished stay in ~/video-debs and are not fetched again.
            APT="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60"
            MIRRORS=("" "http://archive.ubuntu.com/ubuntu/" "http://mirrors.edge.kernel.org/ubuntu/")
            for attempt in 1 2 3; do
              if [ -n "${MIRRORS[$((attempt - 1))]}" ] && [ -f /etc/apt/apt-mirrors.txt ]; then
                echo "${MIRRORS[$((attempt - 1))]}" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              fi
              sudo timeout 60 apt-get $APT update || echo "some package indexes could not be fetched; installing from those that were"
              if sudo timeout 170 apt-get $APT -o Dir::Cache::archives="$HOME/video-debs" -o APT::Keep-Downloaded-Packages=true \
                  install --yes --no-install-recommends ffmpeg; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              echo "install attempt $attempt failed; trying again"
              sleep 10
            done
            sudo chown -R "$USER" ~/video-debs
          fi
          node --version
          ffmpeg -version
          ffprobe -version
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test without provider or dataset access
        env:
          ARGUS_TEST_SHARD: ${{ matrix.shard }}/8
        run: uv run --frozen --offline pytest -q -ra

  tests:
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: test "$RESULT" = success

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan committed tree and all reachable history
        run: |
          tree=$(mktemp -d)
          git archive HEAD | tar -x -C "$tree"
          "$RUNNER_TEMP/gitleaks" dir "$tree" --config .github/gitleaks.toml \
            --redact=100 --ignore-gitleaks-allow --no-banner --no-color
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--full-history -m HEAD" --config .github/gitleaks.toml \
            --redact=100 --ignore-gitleaks-allow --no-banner --no-color
