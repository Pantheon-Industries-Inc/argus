name: Offline checks

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENAI_API_KEY: ""
  OPENROUTER_API_KEYS: ""
  HF_TOKEN: ""
  HF_HUB_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"

jobs:
  # The suite runs as four shards side by side, each a set of whole test files balanced by recorded time
  # (tests/sharding.py); "tests" passes only when every shard does.
  shard:
    name: tests ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.7"
          python-version: "3.11.15"
          enable-cache: true
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          node --version
          ffmpeg -version
          ffprobe -version
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Test without provider or dataset access
        env:
          ARGUS_TEST_SHARD: ${{ matrix.shard }}/4
        run: uv run --frozen --offline pytest -q -ra

  tests:
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: test "$RESULT" = success

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan committed tree and all reachable history
        run: |
          tree=$(mktemp -d)
          git archive HEAD | tar -x -C "$tree"
          "$RUNNER_TEMP/gitleaks" dir "$tree" --config .github/gitleaks.toml \
            --redact=100 --ignore-gitleaks-allow --no-banner --no-color
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--full-history -m HEAD" --config .github/gitleaks.toml \
            --redact=100 --ignore-gitleaks-allow --no-banner --no-color
